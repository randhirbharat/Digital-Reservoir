# Broker for the optional "mqtt" compose profile.
# Create the password file first (stored in the mqtt-auth volume):
#   docker compose --env-file .env.docker --profile mqtt run --rm mosquitto mosquitto_passwd -c /mosquitto/auth/passwd <user>
# Production: add a TLS listener (8883 with certfile/keyfile) and remove the plain listener.
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
persistence true
persistence_location /mosquitto/data/
