[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-analytics"
version = "0.1.0"
description = "Digital Reservoir analytics engine: data quality, signal processing, statistics, HST, ML, anomaly detection, DHI, modal and fragility analysis."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "scikit-learn>=1.4", "openpyxl>=3.1", "PyWavelets>=1.5"]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
include = ["dr_analytics*"]
