name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dr_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dr_owner -d postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install
        working-directory: services/api   # requirements.txt references ../analytics-engine relative to this folder
        run: pip install -r requirements.txt scikit-image
      - name: Analytics engine tests
        run: python -m pytest -q services/analytics-engine/tests
      - name: Ingestion bridge tests
        run: python -m pytest -q services/data-ingestion/tests
      - name: API tests (SQLite)
        working-directory: services/api
        env: { DR_TWIN_ENFORCE_MFA: "true" }
        run: python -m pytest -q tests
      - name: API tests (PostgreSQL, non-superuser role so row-level security applies)
        working-directory: services/api
        env:
          PGPASSWORD: ci_owner_password
          DR_TWIN_ENFORCE_MFA: "true"
          DR_DATABASE_URL: postgresql+psycopg://dr_app:ci_app_password@localhost:5432/dr_test
        run: |
          psql -h localhost -U dr_owner -d postgres -c "create role dr_app login password 'ci_app_password' nosuperuser nobypassrls" -c "create database dr_test owner dr_app"
          python -m pytest -q tests
      - name: Migrations upgrade/downgrade on PostgreSQL
        working-directory: services/api
        env:
          PGPASSWORD: ci_owner_password
          DR_DATABASE_URL: postgresql+psycopg://dr_owner:ci_owner_password@localhost:5432/dr_migrations
        run: |
          psql -h localhost -U dr_owner -d postgres -c "create database dr_migrations"
          alembic upgrade head && alembic downgrade base && alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @dr/shared-utilities test
      - name: Build apps
        env: { NEXT_TELEMETRY_DISABLED: "1" }
        run: pnpm -r --filter "./apps/*" build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose configuration
        run: docker compose --env-file .env.docker.example config --quiet
