# Publishes a static preview of the public website to GitHub Pages.
# One-time repository setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The Engineering Lab, Digital Twin and API need a server and are not part of the preview (see README).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@dr/public-website..."
      - id: pages
        uses: actions/configure-pages@v5
      - name: Static export of the public website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_STATIC_PREVIEW: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          pnpm --filter @dr/public-website build
          touch apps/public-website/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/public-website/out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
